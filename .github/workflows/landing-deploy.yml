name: Landing Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "landing/**"
      - ".github/workflows/landing-deploy.yml"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Build rocketteam static export
        env:
          STATIC_BASE_PATH: /TeamBrain
          DEMO_SEED: "1"
        run: bash landing/build-static.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: landing/rocketteam/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
