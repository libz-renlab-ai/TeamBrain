name: claudefast anchors smoke

# 端到端验证 claudefast canned answers (FASTPROBE / TEAMWORK / PR-PLAN / POSTPR
# 等) 在真实 MiniMax-backed Claude Code session 里仍然命中。
#
# 默认 manual trigger; token 消耗每次 ~1 short -p 调用。要改成 push/PR trigger
# 前先评估 secret 配额。
#
# 依赖 repo secret: MINIMAX_API_KEY (MiniMax fast profile token, 见
# scripts/claudefast-ci.sh)。secret 缺失时整个 job skip (warning, 不当 fail)。

on:
  workflow_dispatch:

jobs:
  anchors:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        id: has_key
        run: |
          if [ -z "${{ secrets.MINIMAX_API_KEY }}" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MINIMAX_API_KEY not set; skipping claudefast anchors smoke"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.has_key.outputs.has_key == 'true'

      - uses: actions/setup-node@v5
        if: steps.has_key.outputs.has_key == 'true'
        with:
          node-version: 22

      - name: Install Claude Code CLI
        if: steps.has_key.outputs.has_key == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Verify project tools anchors
        if: steps.has_key.outputs.has_key == 'true'
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          set -euo pipefail
          out="$(bash scripts/claudefast-ci.sh -p 'what project tools we have?')"
          echo "----- claudefast output -----"
          echo "$out"
          echo "----- anchor check -----"
          missing=()
          for anchor in FASTPROBE TEAMWORK PR-PLAN POSTPR; do
            if ! grep -qF "$anchor" <<<"$out"; then
              missing+=("$anchor")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::canned answer anchors missing: ${missing[*]}"
            exit 1
          fi
          echo "all anchors present"

      - name: Verify visual-proof-pr anchors (docs/VISUAL-PROOF-PR.md)
        if: steps.has_key.outputs.has_key == 'true'
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          set -euo pipefail
          out="$(bash scripts/claudefast-ci.sh -p 'how we visual prove this work ?')"
          echo "----- claudefast output -----"
          echo "$out"

          # Gate 1: case-insensitive substring grep for the 6 baseline anchors.
          # These match the prompts.json visual-proof-pr entry and the
          # docs/VISUAL-PROOF-PR.md §0 anchor list. NOTE: `PR` / `solid` /
          # `merge this` are weak substrings on their own (PR matches every
          # markdown PR-link, solid matches "consolidate", etc) — they're
          # kept here to align with §0 but the REAL fidelity signal is Gate 2.
          echo "----- gate 1: 6-anchor substring check (case-insensitive) -----"
          missing=()
          for anchor in "PR" "visual proof of work" "human" "by-hand merge" "solid" "merge this"; do
            if ! grep -qiF "$anchor" <<<"$out"; then
              missing+=("$anchor")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::visual-proof canned answer Gate-1 anchors missing: ${missing[*]}"
            exit 1
          fi
          echo "Gate 1 PASS: all 6 visual-proof anchors present"

          # Gate 2: case-SENSITIVE check for the high-fidelity unique phrase
          # "ONLY a human by-hand merge". This catches paraphrases that
          # mention "PR", "solid", "merge this" but drop the literal verbatim
          # anchor sentence — e.g. a model that says "Use a PR + manual merge,
          # solid evidence required" would pass Gate 1 but fail Gate 2.
          echo "----- gate 2: case-sensitive verbatim phrase check -----"
          if ! grep -qF "ONLY a human by-hand merge" <<<"$out"; then
            echo "::error::visual-proof canned answer Gate-2 failed: missing verbatim 'ONLY a human by-hand merge' (case-sensitive); the model paraphrased or lowercased the unique discriminator"
            exit 1
          fi
          echo "Gate 2 PASS: verbatim 'ONLY a human by-hand merge' phrase present"
