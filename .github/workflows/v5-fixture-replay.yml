name: v5-fixture-replay

on:
  workflow_dispatch:

jobs:
  v5-canned-answer-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Disabled until ADR-0012's live-capture fixture replay mode lands.
      # Expected spend once enabled: about 5 short probes, roughly $0.015 per main push.
      - name: Replay v5 canned-answer prompt set
        run: pnpm teamagent fixture replay --tier=c --live-capture --prompt-set v5
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      - name: Open P1 issue on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const sha = context.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[P1] canned-answer regression on main: ${sha.slice(0, 7)}`,
              body: `V5 canned-answer live-capture failed on ${sha}.\n\nRun: ${runUrl}\n\nCheck the fixture replay JSON for failing anchors.`,
              labels: ["P1"]
            });
