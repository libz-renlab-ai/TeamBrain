name: Landing Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing-deploy.yml"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: pnpm/action-setup@v5

      - name: Build landing
        run: pnpm install --filter landing && pnpm --filter landing build
        working-directory: ./apps/landing

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
