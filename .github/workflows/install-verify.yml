# issue #155 Order 5: per-PR install verification (V1-V4)
#
# Tests shell entry points plus the pnpm install command path without consuming
# LLM/API quota. V1b strict-permission live Claude Code coverage stays dry-run
# here; live capture belongs to the disabled V5 workflow.

name: install-verify (V1-V4)

on:
  pull_request:
    paths:
      - "release/install.sh"
      - "scripts/bootstrap.sh"
      - "scripts/check-manifest-sync.sh"
      - "scripts/ci-install-*.sh"
      - "scripts/ci-strict-permission-shim.sh"
      - "docs/install-manifest.txt"
      - "packages/**"
      - ".github/workflows/install-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-sync:
    name: V2 - manifest byte-identical
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Run manifest sync check
        run: bash scripts/check-manifest-sync.sh

  preview-flag-smoke:
    name: V2 - --preview prints 5 section markers
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: install.sh --preview emits 5 sections
        run: |
          out=$(bash release/install.sh --preview)
          for section in "[config]" "[skills]" "[kb]" "[download]" "[refusal]"; do
            if ! grep -qF "$section" <<<"$out"; then
              echo "FAIL: install.sh --preview missing section $section" >&2
              echo "$out" >&2
              exit 1
            fi
          done
          echo "OK: install.sh --preview emits all 5 sections"
      - name: bootstrap.sh --preview emits 5 sections
        run: |
          out=$(bash scripts/bootstrap.sh --preview)
          for section in "[config]" "[skills]" "[kb]" "[download]" "[refusal]"; do
            if ! grep -qF "$section" <<<"$out"; then
              echo "FAIL: bootstrap.sh --preview missing section $section" >&2
              echo "$out" >&2
              exit 1
            fi
          done
          echo "OK: bootstrap.sh --preview emits all 5 sections"

  idempotent-rerun:
    name: V3 - preview output stable across reruns
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: --preview output stable across reruns
        run: |
          run1=$(bash release/install.sh --preview)
          run2=$(bash release/install.sh --preview)
          if [ "$run1" != "$run2" ]; then
            echo "FAIL: install.sh --preview is not idempotent across reruns" >&2
            diff <(echo "$run1") <(echo "$run2") >&2
            exit 1
          fi
          echo "OK: install.sh --preview is idempotent"
      - name: --help is also idempotent
        run: |
          run1=$(bash release/install.sh --help)
          run2=$(bash release/install.sh --help)
          [ "$run1" = "$run2" ] || { echo "install.sh --help drifted across runs"; exit 1; }

  timing-budget:
    name: V4 - --preview wall time under budget
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Time install.sh --preview
        run: |
          start=$(date +%s%N)
          bash release/install.sh --preview > /dev/null
          end=$(date +%s%N)
          elapsed_ms=$(( (end - start) / 1000000 ))
          echo "install.sh --preview elapsed: ${elapsed_ms}ms"
          if [ "$elapsed_ms" -gt 2000 ]; then
            echo "FAIL: install.sh --preview took ${elapsed_ms}ms; budget is 2000ms" >&2
            exit 1
          fi

  pnpm-install-judge:
    name: V1-V4 - pnpm install judge JSON
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Run install judge harness
        run: bash scripts/ci-install-judge.sh --dry-run
      - name: Upload judge evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: install-verify-judge
          path: .judge/

# Anti-goals:
# - Does NOT consume API quota.
# - Does NOT run live V5 canned-answer probes.
# - Does NOT use claudefast in PR CI; V1b is represented by deterministic dry-run JSON.
